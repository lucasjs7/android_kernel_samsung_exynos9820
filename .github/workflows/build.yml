name: Build Kernel Docker S10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v4
        with:
          path: gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu
          key: gcc-arm-10.3-2021.07

      - name: Download Arm GNU Toolchain (GCC 10.3)
        run: |
          if [ ! -d "gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu" ]; then
            wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz
            tar -xf gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz
          fi
          echo "$GITHUB_WORKSPACE/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3

      - name: Configure AnyKernel3 for Samsung S10
        run: |
          cat > AnyKernel3/anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=Docker Kernel for Galaxy S10 (LineageOS 23.2)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=beyond1lte
          device.name2=beyond1
          device.name3=SM-G973F
          device.name4=SM-G973N
          device.name5=beyond1ltexx
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-

          make exynos9820-beyond1lte_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-none-linux-gnu- KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Docker-S10.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Docker-S10
          path: Kernel-Docker-S10.zip
