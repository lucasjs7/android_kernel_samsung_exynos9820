name: Build Kernel Docker S10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make exynos9820-beyond1lte_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          cp arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Docker-S10.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Docker-S10
          path: Kernel-Docker-S10.zip
